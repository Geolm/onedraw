<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" role="img"><rect x="0" y="0" width="1040" height="520" fill="transparent"/><rect x="0" y="0" width="1040" height="520" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1.5"/><text x="520.0" y="42.0" font-size="24" fill="#0F172A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Shape groups</text><text x="520.0" y="70.0" font-size="14" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">A group behaves like one shape — one global AABB, one outline, one transparency.</text><text x="280.0" y="120.0" font-size="16" fill="#0F172A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">A shape group</text><rect x="70.0" y="150.0" width="400.0" height="250.0" rx="14" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="8 6"/><circle cx="360.0" cy="225.0" r="46.0" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/><rect x="90.0" y="180.0" width="130.0" height="80.0" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/><path d="M110 300 L180 235 L250 310 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5" stroke-linecap="butt"/><text x="70.0" y="142.0" font-size="13" fill="#6D28D9" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">begin_group</text><text x="70.0" y="414.0" font-size="13" fill="#6D28D9" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">end_group</text><text x="270.0" y="388.0" font-size="13" fill="#7C3AED" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">global group AABB</text><text x="790.0" y="120.0" font-size="16" fill="#0F172A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Per-tile linked list</text><text x="790.0" y="150.0" font-size="12" fill="#64748B" text-anchor="middle" font-family="Helvetica, Aria