<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" role="img"><rect x="0" y="0" width="1080" height="520" fill="transparent"/><rect x="0" y="0" width="1080" height="520" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1.5"/><text x="540.0" y="42.0" font-size="23" fill="#0F172A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">One-pass exclusive scan (single dispatch per region)</text><text x="540.0" y="70.0" font-size="13" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">A region’s whole prefix-sum is one threadgroup — local loop + SIMD waves, no cascaded kernels.</text><rect x="120.0" y="150.0" width="90.0" height="44.0" rx="6" fill="#CFFAFE" stroke="#0891B2" stroke-width="1.5"/><text x="165.0" y="170.0" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">lane 0</text><text x="165.0" y="185.0" font-size="12" fill="#0891B2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Σ=1</text><rect x="218.0" y="150.0" width="90.0" height="44.0" rx="6" fill="#CFFAFE" stroke="#0891B2" stroke-width="1.5"/><text x="263.0" y="170.0" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">lane 1</text><text x="263.0" y="185.0" font-size="12" fill="#0891B2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Σ=2</text><rect x="316.0" y="150.0" width="90.0" height="44.0" rx="6" fill="#CFFAFE" stroke="#0891B2" stroke-width="1.5"/><text x="361.0" y="170.0" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">lane 2</text><text x="361.0" y="185.0" font-size="12" fill="#0891B2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Σ=0</text><rect x="414.0" y="150.0" width="90.0" height="44.0