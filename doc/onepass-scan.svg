weight="bold">Σ=2</text><line x1="114.0" y1="142.0" x2="510.0" y2="142.0" stroke="#64748B" stroke-width="2" stroke-linecap="butt"/><line x1="114.0" y1="142.0" x2="114.0" y2="194.0" stroke="#64748B" stroke-width="2" stroke-linecap="butt"/><line x1="510.0" y1="142.0" x2="510.0" y2="194.0" stroke="#64748B" stroke-width="2" stroke-linecap="butt"/><text x="315.0" y="136.0" font-size="12" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">wave 0  (32 lanes)</text><line x1="506.0" y1="142.0" x2="902.0" y2="142.0" stroke="#64748B" stroke-width="2" stroke-linecap="butt"/><line x1="506.0" y1="142.0" x2="506.0" y2="194.0" stroke="#64748B" stroke-width="2" stroke-linecap="butt"/><line x1="902.0" y1="142.0" x2="902.0" y2="194.0" stroke="#64748B" stroke-width="2" stroke-linecap="butt"/><text x="707.0" y="136.0" font-size="12" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">wave 1  (32 lanes)</text><line x1="312.0" y1="196.0" x2="312.0" y2="246.0" stroke="#334155" stroke-width="2" stroke-linecap="butt"/><polygon points="312.0,246.0 308.5,237.7 315.5,237.7" fill="#334155"/><rect x="252.0" y="250.0" width="120.0" height="40.0" rx="6" fill="#CFFAFE" stroke="#0891B2" stroke-width="1.5"/><text x="312.0" y="275.0" font-size="12" fill="#0891B2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">simd_sum = 4</text><line x1="704.0" y1="196.0" x2="704.0" y2="246.0" stroke="#334155" stroke-width="2" stroke-linecap="butt"/><polygon points="704.0,246.0 700.5,237.7 707.5,237.7" fill="#334155"/><rect x="644.0" y="250.0" width="120.0" height="40.0" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="704.0" y="275.0" font-size="12" fill="#7C3AED" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">simd_sum = 6</text><line x1="120.0" y1="312.0" x2="986.0" y2="312.0" stroke="#94A3B8" stroke-width="2" stroke-linecap="butt" 