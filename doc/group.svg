r="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">… next</text><rect x="560.0" y="300.0" width="450.0" height="90.0" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="6 5"/><text x="580.0" y="324.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">If no shape of the group touches a tile, clean_list() drops</text><text x="580.0" y="343.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">the begin / end nodes so the tile skips the empty group.</text></svg>