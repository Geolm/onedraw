<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img"><rect x="0" y="0" width="1000" height="540" fill="transparent"/><rect x="0" y="0" width="1000" height="540" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1.5"/><text x="500.0" y="42.0" font-size="24" fill="#0F172A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Empty groups are cleaned per tile</text><text x="500.0" y="70.0" font-size="14" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">A tile may hold a group’s begin/end without any of its shapes.</text><text x="60.0" y="120.0" font-size="15" fill="#B45309" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">before  clean_list()</text><rect x="85.0" y="125.0" width="170.0" height="50.0" rx="8" fill="#E2E8F0" stroke="#475569" stroke-width="1.4"/><text x="170.0" y="154.2" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">head</text><rect x="275.0" y="125.0" width="170.0" height="50.0" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="360.0" y="154.2" font-size="12" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">begin_group</text><line x1="283.0" y1="158.0" x2="439.0" y2="142.0" stroke="#DC2626" stroke-width="2" stroke-linecap="butt"/><rect x="465.0" y="125.0" width="170.0" height="50.0" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/><text x="550.0" y="154.2" font-size="12" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">end_group</text><line x1="473.0" y1="158.0" x2="629.0" y2="142.0" stroke="#DC2626" stroke-width="2" stroke-linecap="butt"/><rect x="675.0" y="125.0" width="170.0" height="50.0" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.4"/><text x="760.0" y="154.2" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">other shape</text><line x1="257.0" y1="150.0" x2="273.0" y2="150.0" stroke="#334155" stroke-width="2.2" stroke-linecap="butt"/><polygon points="273.0,150.0 264.7,153.5 264.7,146.5" fill="#334155"/><line x1="447.0" y1="150.0" x2="463.0" y2="150.0" stroke="#334155" stroke-width="2.2" stroke-linecap="butt"/><polygon points="463.0,150.0 454.7,153.5 454.7,146.5" fill="#334155"/><line x1="637.0" y1="150.0" x2="673.0" y2="150.0" stroke="#334155" stroke-width="2.2" stroke-linecap="butt"/><polygon points="673.0,150.0 664.7,153.5 664.7,146.5" fill="#334155"/><line x1="455.0" y1="182.0" x2="455.0" y2="250.0" stroke="#334155" stroke-width="2.6" stroke-linecap="butt"/><polygon points="455.0,250.0 451.5,241.7 458.5,241.7" fill="#334155"/><text x="470.0" y="220.0" font-size="13" fill="#B45309" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">clean_list()</text><text x="60.0" y="262.0" font-size="15" fill="#16A34A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">after  clean_list()</text><rect x="85.0" y="265.0" width="170.0" height="50.0" rx="8" fill="#E2E8F0" stroke="#475569" stroke-width="1.4"/><text x="170.0" y="294.2" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">head</text><rect x="675.0" y="265.0" width="170.0" height="50.0" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.4"/><text x="760.0" y="294.2" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">other shape</text><line x1="257.0" y1="290.0" x2="673.0" y2="290.0" stroke="#334155" stroke-width="2.2" stroke-linecap="butt"/><polygon points="673.0,290.0 664.7,293.5 664.7,286.5" fill="#334155"/><rect x="60.0" y="360.0" width="880.0" height="110.0" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="6 5"/><text x="82.0" y="392.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">The tile intersects the group’s AABB, so the begin and end commands are added. But none of the group’s shapes actually</text><text x="82.0" y="412.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">reach the tile, so the begin→end pair wraps zero primitives. clean_list() detects this and unlinks both nodes — the tile</text><text x="82.0" y="432.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">skips the empty group entirely.</text></svg>