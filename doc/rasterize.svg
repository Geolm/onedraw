<text x="400.0" y="240.0" font-size="12.5" fill="#DD8500" text-anchor="bold" font-family="Helvetica, Arial, sans-serif" font-weight="middle">v0  v1  v2  v3</text>
<text x="400.0" y="262.0" font-size="12.5" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">u: 0..1, v: 0..1</text>
<text x="400.0" y="282.0" font-size="12.5" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">(strip topology, 4 vertices)</text>
<text x="440.0" y="322.0" font-size="13" fill="#64748B" text-anchor="bold" font-family="Helvetica, Arial, sans-serif" font-weight="middle">the fragment program does</text>
<text x="352.0" y="344.0" font-size="12.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">1.  read the tile's chunk list</text>
<text x="352.0" y="363.0" font-size="12.5" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">       (6 commands per 16-byte chunk)</text>
<text x="352.0" y="382.0" font-size="12.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">2.  for each command: evaluate its</text>
<text x="352.0" y="401.0" font-size="12.5" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">       SDF at the fragment position</text>
<text x="352.0" y="420.0" font-size="12.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">3.  anti-alias at 1-px steps along</text>
<text x="352.0" y="439.0" font-size="12.5" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">       the normal direction</text>
<text x="352.0" y="458.0" font-size="12.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">4.  combine: min / smoothmin</text>
<text x="352.0" y="477.0" font-size="12.5" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">5.  alpha-blend into the screenshot</text>
<text x="352.0" y="496.0" font-size="12.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">6.  write the tile cache</text>
<line x1="505.0" y1="512.0" x2="580.0" y2="512.0" stroke="#1E293B" stroke-width="2"/>
<polygon points="580.0,512.0 573.7,515.0 573.7,509.0" fill="#1E293B"/>
<rect x="580.0" y="430.0" width="150.0" height="150.0" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="655.0" y="462.0" font-size="14" fill="#1E293B" text-anchor="bold" font-family="Helvetica, Arial, sans-serif" font-weight="middle">screenshot</text>
<text x="655.0" y="486.0" font-size="12" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">2560 x 1440</text>
<text x="655.0" y="506.0" font-size="12" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">(or the cached</text>
<text x="655.0" y="524.0" font-size="12" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">tile's 8 x 8 block)</text>
<rect x="810.0" y="80.0" width="350.0" height="300.0" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="985.0" y="106.0" font-size="15" fill="#1E293B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">why no derivatives</text>
<text x="835.0" y="128.0" font-size="13" fill="#3D6BD1" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">rendering happens at pixel level:</text>
<text x="835.0" y="150.0" font-size="13" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">one fragment per pixel, so edge</text>
<text x="835.0" y="172.0" font-size="13" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">quality is controlled directly</text>
<text x="835.0" y="194.0" font-size="13" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">and ddx/ddy are never needed</text>
<text x="835.0" y="216.0" font-size="13" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal"></text>
<text x="835.0" y="238.0" font-size="13" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">one tile is covered by at most a</text>
<text x="835.0" y="260.0" font-size="13" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">few hundred 8-vertex quads, which</text>
<text x="835.0" y="282.0" font-size="13" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">a fragment shader can loop over</text>
<text x="835.0" y="304.0" font-size="13" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">comfortably</text>
<rect x="810.0" y="420.0" width="350.0" height="200.0" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="835.0" y="462.0" font-size="13" fill="#2F9E63" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">the same pass runs on a cached</text>
<text x="835.0" y="484.0" font-size="13" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">tile to verify it is still valid;</text>
