<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 610" width="1260" height="610" role="img"><rect x="0" y="0" width="1260" height="610" fill="transparent"/><rect x="0" y="0" width="1260" height="610" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1.5"/><text x="630.0" y="44.0" font-size="24" fill="#0F172A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">The GPU-driven rendering pipeline</text><text x="630.0" y="74.0" font-size="14" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">Every frame: the CPU writes draw commands, the GPU bins them into tiles, then rasterizes with one indirect draw call.</text><text x="124.0" y="152.0" font-size="13" fill="#0E7490" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">CPU</text><text x="620.0" y="152.0" font-size="13" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">GPU — binning (compute)</text><text x="620.0" y="398.0" font-size="13" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">GPU — rasterization (render)</text><rect x="40.0" y="170.0" width="168.0" height="110.0" rx="12" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.6"/><rect x="41.2" y="171.2" width="6.0" height="107.6" rx="3" fill="#0891B2" stroke="none" stroke-width="1.5"/><text x="60.0" y="196.4" font-size="15" fill="#0F172A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Draw commands</text><text x="60.0" y="213.0" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">CPU writes each</text><text x="60.0" y="228.8" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">frame:</text><text x="60.0" y="244.6" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">type · color · aabb ·</text><text x="60.0" y="260.5" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">data[]</text><line x1="210.0" y1="225.0" x2="236.4" y2="225.0" stroke="#334155" stroke-width="2.4" stroke-linecap="butt"/><polygon points="236.4,225.0 228.1,228.5 228.1,221.5" fill="#334155"/><rect x="238.4" y="170.0" width="168.0" height="110.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><rect x="239.6" y="171.2" width="6.0" height="107.6" rx="3" fill="#2563EB" stroke="none" stroke-width="1.5"/><text x="258.4" y="196.4" font-size="15" fill="#0F172A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">predicate</text><text x="258.4" y="213.0" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">one thread per</text><text x="258.4" y="228.8" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">command:</text><text x="258.4" y="244.6" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">visible in this</text><text x="258.4" y="260.5" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">region?</text><line x1="408.4" y1="225.0" x2="434.8" y2="225.0" stroke="#334155" stroke-width="2.4" stroke-linecap="butt"/><polygon points="434.8,225.0 426.5,228.5 426.5,221.5" fill="#334155"/><rect x="436.8" y="170.0" width="168.0" height="110.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><rect x="438.0" y="171.2" width="6.0" height="107.6" rx="3" fill="#2563EB" stroke="none" stroke-width="1.5"/><text x="456.8" y="204.3" font-size="15" fill="#0F172A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">exclusive scan</text><text x="456.8" y="220.9" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">prefix-sum over the</text><text x="456.8" y="236.7" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">predicate (single</text><text x="456.8" y="252.6" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">SIMD pass)</text><line x1="606.8" y1="225.0" x2="633.2" y2="225.0" stroke="#334155" stroke-width="2.4" stroke-linecap="butt"/><polygon points="633.2,225.0 624.9,228.5 624.9,221.5" fill="#334155"/><rect x="635.2" y="170.0" width="168.0" height="110.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><rect x="636.4" y="171.2" width="6.0" height="107.6" rx="3" fill="#2563EB" stroke="none" stroke-width="1.5"/><text x="655.2" y="204.3" font-size="15" fill="#0F172A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">region bin</text><text x="655.2" y="220.9" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">compact ordered index</text><text x="655.2" y="236.7" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">list</text><text x="655.2" y="252.6" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">per 16×16-tile region</text><line x1="805.2" y1="225.0" x2="831.6" y2="225.0" stroke="#334155" stroke-width="2.4" stroke-linecap="butt"/><polygon points="831.6,225.0 823.3,228.5 823.3,221.5" fill="#334155"/><rect x="833.6" y="170.0" width="168.0" height="110.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><rect x="834.8" y="171.2" width="6.0" height="107.6" rx="3" fill="#2563EB" stroke="none" stroke-width="1.5"/><text x="853.6" y="212.2" font-size="15" fill="#0F172A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">tile bin</text><text x="853.6" y="228.8" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">per-tile linked list</text><text x="853.6" y="244.6" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">of draw commands</text><line x1="1003.6" y1="225.0" x2="1030.0" y2="225.0" stroke="#334155" stroke-width="2.4" stroke-linecap="butt"/><polygon points="1030.0,225.0 1021.7,228.5 1021.7,221.5" fill="#334155"/><rect x="1032.0" y="170.0" width="168.0" height="110.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><rect x="1033.2" y="171.2" width="6.0" height="107.6" rx="3" fill="#2563EB" stroke="none" stroke-width="1.5"/><text x="1052.0" y="204.3" font-size="15" fill="#0F172A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">write ICB</text><text x="1052.0" y="220.9" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">count active tiles</text><text x="1052.0" y="236.7" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">→ indirect draw</text><text x="1052.0" y="252.6" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">buffer</text><line x1="1116.0" y1="282.0" x2="1120.0" y2="416.0" stroke="#334155" stroke-width="2.4" stroke-linecap="butt"/><polygon points="1120.0,416.0 1116.2,407.8 1123.3,407.6" fill="#334155"/><rect x="995.0" y="418.0" width="250.0" height="124.0" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><rect x="996.2" y="419.2" width="6.0" height="121.6" rx="3" fill="#D97706" stroke="none" stroke-width="1.5"/><text x="1015.0" y="467.2" font-size="15" fill="#0F172A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">indirect draw</text><text x="1015.0" y="483.8" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">1 draw call · N = active</text><text x="1015.0" y="499.6" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">tile instances (triangle strip)</text><rect x="650.0" y="418.0" width="300.0" height="124.0" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/><rect x="651.2" y="419.2" width="6.0" height="121.6" rx="3" fill="#DC2626" stroke="none" stroke-width="1.5"/><text x="670.0" y="459.3" font-size="15" fill="#0F172A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">vertex + fragment</text><text x="670.0" y="475.9" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">walk linked list → SDF</text><text x="670.0" y="491.7" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">group min / smooth-min</text><text x="670.0" y="507.6" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">anti-alias · alpha blend → sRGB</text><rect x="370.0" y="418.0" width="220.0" height="124.0" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.6"/><rect x="371.2" y="419.2" width="6.0" height="121.6" rx="3" fill="#16A34A" stroke="none" stroke-width="1.5"/><text x="390.0" y="467.2" font-size="15" fill="#0F172A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">framebuffer</text><text x="390.0" y="483.8" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">sRGB 8-bit</text><text x="390.0" y="499.6" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">(the screen)</text><line x1="995.0" y1="480.0" x2="950.0" y2="480.0" stroke="#334155" stroke-width="2.4" stroke-linecap="butt"/><polygon points="950.0,480.0 958.3,476.5 958.3,483.5" fill="#334155"/><line x1="650.0" y1="480.0" x2="590.0" y2="480.0" stroke="#334155" stroke-width="2.4" stroke-linecap="butt"/><polygon points="590.0,480.0 598.3,476.5 598.3,483.5" fill="#334155"/></svg>