<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 600" width="1140" height="600" role="img"><rect x="0" y="0" width="1140" height="600" fill="transparent"/><rect x="0" y="0" width="1140" height="600" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1.5"/><text x="570.0" y="42.0" font-size="24" fill="#0F172A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Tile rasterization</text><text x="570.0" y="70.0" font-size="14" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">An indirect draw call rasterizes each active tile; the fragment shader walks its linked list.</text><rect x="45.0" y="240.0" width="180.0" height="120.0" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><rect x="46.2" y="241.2" width="6.0" height="117.6" rx="3" fill="#D97706" stroke="none" stroke-width="1.5"/><text x="65.0" y="279.3" font-size="15" fill="#0F172A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">indirect buffer</text><text x="65.0" y="295.9" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">num_tiles</text><text x="65.0" y="311.7" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">· triangle strip</text><text x="65.0" y="327.6" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">· 4 vertices</text><rect x="265.0" y="240.0" width="220.0" height="120.0" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><rect x="266.2" y="241.2" width="6.0" height="117.6" rx="3" fill="#2563EB" stroke="none" stroke-width="1.5"/><text x="285.0" y="287.2" font-size="15" fill="#0F172A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">vertex shader</text><text x="285.0" y="303.8" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">tile_index ← instance_id</text><text x="285.0" y="319.6" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">build the tile quad (flat)</text><rect x="525.0" y="175.0" width="360.0" height="250.0" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/><rect x="526.2" y="176.2" width="6.0" height="247.6" rx="3" fill="#DC2626" stroke="none" stroke-width="1.5"/><text x="545.0" y="205.0" font-size="15" fill="#0F172A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">fragment shader</text><circle cx="543.0" cy="235.0" r="9.0" fill="#DC2626" stroke="none" stroke-width="2"/><text x="543.0" y="238.5" font-size="11" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">1</text><text x="559.0" y="239.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">read head[tile]  →  first node</text><circle cx="543.0" cy="269.0" r="9.0" fill="#DC2626" stroke="none" stroke-width="2"/><text x="543.0" y="272.5" font-size="11" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">2</text><text x="559.0" y="273.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">walk the tile’s linked list</text><circle cx="543.0" cy="303.0" r="9.0" fill="#DC2626" stroke="none" stroke-width="2"/><text x="543.0" y="306.5" font-size="11" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">3</text><text x="559.0" y="307.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">evaluate each SDF  →  distance</text><circle cx="543.0" cy="337.0" r="9.0" fill="#DC2626" stroke="none" stroke-width="2"/><text x="543.0" y="340.5" font-size="11" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">4</text><text x="559.0" y="341.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">group: accumulate with min / smooth-min</text><circle cx="543.0" cy="371.0" r="9.0" fill="#DC2626" stroke="none" stroke-width="2"/><text x="543.0" y="374.5" font-size="11" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">5</text><text x="559.0" y="375.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">anti-alias + alpha-blend  →  sRGB</text><rect x="925.0" y="240.0" width="170.0" height="120.0" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.6"/><rect x="926.2" y="241.2" width="6.0" height="117.6" rx="3" fill="#16A34A" stroke="none" stroke-width="1.5"/><text x="945.0" y="287.2" font-size="15" fill="#0F172A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">sRGB framebuffer</text><text x="945.0" y="303.8" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">8-bit</text><text x="945.0" y="319.6" font-size="12" fill="#64748B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">(the screen)</text><line x1="227.0" y1="300.0" x2="263.0" y2="300.0" stroke="#334155" stroke-width="2.4" stroke-linecap="butt"/><polygon points="263.0,300.0 254.7,303.5 254.7,296.5" fill="#334155"/><line x1="487.0" y1="300.0" x2="523.0" y2="300.0" stroke="#334155" stroke-width="2.4" stroke-linecap="butt"/><polygon points="523.0,300.0 514.7,303.5 514.7,296.5" fill="#334155"/><line x1="887.0" y1="300.0" x2="923.0" y2="300.0" stroke="#334155" stroke-width="2.4" stroke-linecap="butt"/><polygon points="923.0,300.0 914.7,303.5 914.7,296.5" fill="#334155"/></svg>