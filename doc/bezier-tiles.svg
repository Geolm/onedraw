<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" width="1180" height="660" role="img"><rect x="0" y="0" width="1180" height="660" fill="transparent"/><rect x="0" y="0" width="1180" height="660" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1.5"/><text x="590.0" y="42.0" font-size="24" fill="#0F172A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Bézier binning: one curve, scattered across tiles</text><text x="590.0" y="70.0" font-size="13.5" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">The curve is a single command of capsules, but each tile stores only the capsules it touches.</text><line x1="90.0" y1="150.0" x2="90.0" y2="630.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><line x1="90.0" y1="150.0" x2="570.0" y2="150.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><line x1="150.0" y1="150.0" x2="150.0" y2="630.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><line x1="90.0" y1="210.0" x2="570.0" y2="210.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><line x1="210.0" y1="150.0" x2="210.0" y2="630.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><line x1="90.0" y1="270.0" x2="570.0" y2="270.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><line x1="270.0" y1="150.0" x2="270.0" y2="630.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><line x1="90.0" y1="330.0" x2="570.0" y2="330.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><line x1="330.0" y1="150.0" x2="330.0" y2="630.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><line x1="90.0" y1="390.0" x2="570.0" y2="390.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><line x1="390.0" y1="150.0" x2="390.0" y2="630.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><line x1="90.0" y1="450.0" x2="570.0" y2="450.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><line x1="450.0" y1="150.0" x2="450.0" y2="630.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><line x1="90.0" y1="510.0" x2="570.0" y2="510.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><line x1="510.0" y1="150.0" x2="510.0" y2="630.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><line x1="90.0" y1="570.0" x2="570.0" y2="570.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><line x1="570.0" y1="150.0" x2="570.0" y2="630.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><line x1="90.0" y1="630.0" x2="570.0" y2="630.0" stroke="#CBD5E1" stroke-width="1.1" stroke-linecap="butt"/><rect x="86.0" y="146.0" width="488.0" height="488.0" rx="0" fill="none" stroke="#475569" stroke-width="2"/><path d="M 130.0 350.0 L 175.8 318.2 L 218.5 300.9 L 259.1 294.8 L 298.1 297.0 L 336.5 304.4 L 375.0 313.8 L 414.3 322.1 L 455.2 326.3 L 498.4 323.3 L 544.8 310.0 L 595.1 283.2 L 650.0 240.0" fill="none" stroke="#BBF7D0" stroke-width="20" stroke-linecap="round"/><path d="M 130.0 350.0 L 175.8 318.2 L 218.5 300.9 L 259.1 294.8 L 298.1 297.0 L 336.5 304.4 L 375.0 313.8 L 414.3 322.1 L 455.2 326.3 L 498.4 323.3 L 544.8 310.0 L 595.1 283.2 L 650.0 240.0" fill="none" stroke="#16A34A" stroke-width="4" stroke-linecap="round"/><text x="156.0" y="346.0" font-size="11" fill="#16A34A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">1</text><text x="156.0" y="286.0" font-size="11" fill="#16A34A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">1</text><text x="216.0" y="286.0" font-size="11" fill="#16A34A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">1</text><text x="276.0" y="286.0" font-size="11" fill="#16A34A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">2</text><text x="336.0" y="286.0" font-size="11" fill="#16A34A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">1</text><text x="396.0" y="286.0" font-size="11" fill="#16A34A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">2</text><text x="456.0" y="286.0" font-size="11" fill="#16A34A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">1</text><text x="516.0" y="286.0" font-size="11" fill="#16A34A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">2</text><text x="516.0" y="226.0" font-size="11" fill="#16A34A" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">1</text><text x="330.0" y="134.0" font-size="12" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">tiles</text><rect x="760.0" y="150.0" width="360.0" height="300.0" rx="14" fill="#FBFCFE" stroke="#CBD5E1" stroke-width="1.3"/><text x="940.0" y="182.0" font-size="15" fill="#0F172A" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">why this matters</text><text x="790.0" y="214.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">the curve is one draw command</text><text x="790.0" y="236.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">  (12 capsules in the buffer)</text><text x="790.0" y="258.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal"></text><text x="790.0" y="280.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">binning scatters it:</text><text x="790.0" y="302.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">  each tile keeps only the</text><text x="790.0" y="324.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">  capsules that reach it</text><text x="790.0" y="346.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">  (1–3, here)</text><text x="790.0" y="368.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal"></text><text x="790.0" y="390.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">a fragment shader evaluates a</text><text x="790.0" y="412.0" font-size="13" fill="#1F2937" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">  few SDFs — not all 12</text></svg>