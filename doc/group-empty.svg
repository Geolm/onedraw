<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img">
<rect x="0" y="0" width="1120" height="600" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="560.0" y="42.0" font-size="20" fill="#1E293B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Empty groups are cleaned per tile</text>
<text x="560.0" y="68.0" font-size="13.5" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="normal">if no group shape reaches a tile, the begin/end pair is removed</text>
<rect x="60.0" y="120.0" width="560.0" height="170.0" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="84.0" y="152.0" font-size="14" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">tile A · group reaches it</text>
<rect x="84.0" y="180.0" width="110.0" height="34.0" rx="17.0" fill="#E9E6FB" stroke="#7B72E3" stroke-width="1.6"/>
<text x="139.0" y="201.5" font-size="12.5" fill="#7B72E3" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">begin</text>
<rect x="206.0" y="180.0" width="110.0" height="34.0" rx="17.0" fill="#D7F0E2" stroke="#2F9E63" stroke-width="1.6"/>
<text x="261.0" y="201.5" font-size="12.5" fill="#2F9E63" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">disc</text>
<rect x="328.0" y="180.0" width="110.0" height="34.0" rx="17.0" fill="#DBEAFE" stroke="#3D6BD1" stroke-width="1.6"/>
<text x="383.0" y="201.5" font-size="12.5" fill="#3D6BD1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">box</text>
<rect x="450.0" y="180.0" width="110.0" height="34.0" rx="17.0" fill="#E9E6FB" stroke="#7B72E3" stroke-width="1.6"/>
<text x="505.0" y="201.5" font-size="12.5" fill="#7B72E3" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">end</text>
<text x="540.0" y="252.0" font-size="13" fill="#2F9E63" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">kept (group has geometry)</text>
<rect x="60.0" y="320.0" width="560.0" height="170.0" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="84.0" y="352.0" font-size="14" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="bold">tile B · group does not reach it</text>
<rect x="84.0" y="380.0" width="110.0" height="34.0" rx="17.0" fill="#EEF1F5" stroke="#64748B" stroke-width="1.6"/>
<text x="139.0" y="401.5" font-size="12.5" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">begin</text>
<line x1="84.0" y1="414.0" x2="194.0" y2="380.0" stroke="#D25B53" stroke-width="2"/>
<rect x="206.0" y="380.0" width="110.0" height="34.0" rx="17.0" fill="#EEF1F5" stroke="#64748B" stroke-width="1.6"/>
<text x="261.0" y="401.5" font-size="12.5" fill="#64748B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">end</text>
<line x1="206.0" y1="414.0" x2="316.0" y2="380.0" stroke="#D25B53" stroke-width="2"/>
<text x="540.0" y="452.0" font-size="13" fill="#D25B53" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-weight="bold">begin/end dropped — nothing left to draw</text>
<rect x="660.0" y="120.0" width="400.0" height="370.0" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="860.0" y="146.0" font-size="15" fill="#1E293B" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold">tile_bin walks the region list</text>
<text x="690.0" y="180.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">in reverse order, tracking the</text>
<text x="690.0" y="200.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">group's extra margin; the</text>
<text x="690.0" y="220.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">begin/end pair is only emitted</text>
<text x="690.0" y="240.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">once a primitive of the group</text>
<text x="690.0" y="260.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">actually reaches the tile —</text>
<text x="690.0" y="280.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">a group that wraps zero</text>
<text x="690.0" y="300.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">primitives produces no nodes,</text>
<text x="690.0" y="320.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">no separate clean-up pass.</text>
</svg>
