<rect x="700.0" y="130.0" width="360.0" height="380.0" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="730.0" y="170.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">the curve is tessellated on the CPU</text>
<text x="730.0" y="190.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">into many capsule draw commands</text>
<text x="730.0" y="210.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">(one per segment). binning scatters</text>
<text x="730.0" y="230.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">them so each tile keeps only the</text>
<text x="730.0" y="250.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">capsules that reach it (1–3 here).</text>
<text x="730.0" y="290.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">a fragment then evaluates just</text>
<text x="730.0" y="310.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">a few SDFs per tile instead of</text>
<text x="730.0" y="330.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">every capsule of the curve —</text>
<text x="730.0" y="350.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">that is the payoff that makes</text>
<text x="730.0" y="370.0" font-size="13.5" fill="#1E293B" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-weight="normal">tessellation affordable.</text>
