<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300">
  <style>
    text { fill: #3b4252; font-family: sans-serif; font-size: 15px; }
    .title { fill: #3b4252; font-family: sans-serif; font-size: 22px; font-weight: bold; }
    .node { fill: #eceff4; stroke: #4c566a; stroke-width: 2; }
    .edge { stroke: #4c566a; stroke-width: 2; }
    .note { fill: #5e81ac; font-size: 13px; }
  </style>
  <text x="180" y="30" class="title" text-anchor="middle">SVG pipeline</text>
  <text x="180" y="50" class="note" text-anchor="middle">parse, prepare, draw</text>

  <g transform="translate(90, 70)">
    <rect x="0" y="0" width="180" height="44" rx="8" class="node"/>
    <text x="90" y="27" text-anchor="middle">svg_parse</text>
  </g>
  <line x1="180" y1="114" x2="180" y2="140" class="edge"/>
  <polygon points="174,134 186,134 180,144" fill="#4c566a"/>

  <g transform="translate(90, 150)">
    <rect x="0" y="0" width="180" height="44" rx="8" class="node"/>
    <text x="90" y="27" text-anchor="middle">svg_prepare</text>
  </g>
  <line x1="180" y1="194" x2="180" y2="220" class="edge"/>
  <polygon points="174,214 186,214 180,224" fill="#4c566a"/>

  <g transform="translate(90, 230)" color="#5e81ac">
    <rect x="0" y="0" width="180" height="44" rx="8" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="90" y="27" text-anchor="middle" fill="currentColor">svg_draw</text>
  </g>

  <svg x="0" y="70" width="70" height="204" viewBox="0 0 70 204" preserveAspectRatio="xMidYMid meet">
    <text x="35" y="24" text-anchor="middle">in</text>
    <line x1="35" y1="34" x2="35" y2="170" class="edge" stroke-dasharray="4 4"/>
    <text x="35" y="192" text-anchor="middle">out</text>
  </svg>

  <text x="290" y="90">
    <tspan x="290" y="0">text</tspan>
    <tspan x="290" dy="20">content</tspan>
    <tspan x="290" dy="20">spans</tspan>
  </text>
</svg>
